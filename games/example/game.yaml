# 게임 정의 파일의 틀.
#
#   games/example/ 폴더를 통째로 복사해서 자기 게임에 맞게 고친다.
#
#       cp -r games/example games/mygame        (PowerShell: Copy-Item -Recurse)
#       python pipeline.py <로그폴더> --game games/mygame
#
#   games/ 아래는 example 만 저장소에 올라간다. 자기 게임 폴더는 .gitignore 가
#   막아 둔다 — 올리고 싶으면 .gitignore 에서 그 줄을 고친다.
#
#   이 폴더의 세 파일 중 필수는 이것 하나다.
#       game.yaml   지표 정의 + (협동 게임이면) merge 규칙
#       views.sql   선택. 손으로 쓴 뷰
#       cards.py    선택. 손으로 쓴 Metabase 카드
#
# 아래 이벤트·파라미터 이름은 전부 예시다. 자기 게임의 로그에 실제로 찍히는
# 이름으로 바꾼다. 로그에 없는 이벤트를 적어도 오류는 아니고 값이 안 나올 뿐이다.

# ------------------------------------------------------------------ 지표
#
#   type    count | sum | avg | min | max | formula
#   scope   session(기본, 세션×플레이어) | party(세션 전체) | global
#   where   파라미터 조건. 값 그대로 쓰면 "같다", {lt|lte|gt|gte|ne: 값} 도 된다
#   by      이 파라미터로 쪼개서 계산한다
#   default 해당 이벤트가 없는 세션에 채울 값 (0 이 "없음" 이 아니라 "0" 일 때만)
metrics:
  - name: level_count
    type: count
    event: level_completed

  - name: level_cleared
    type: count
    event: level_completed
    where: { is_success: true }

  - name: clear_rate
    type: formula
    formula: level_cleared / level_count

  - name: avg_level_time_ms
    type: avg
    event: level_completed
    param: elapsed_ms

  - name: coins_spent
    type: sum
    event: coins_changed
    param: delta
    where: { delta: { lt: 0 } }
    default: 0

  - name: deaths_by_level
    type: count
    event: player_died
    by: level_id

# ------------------------------------------------------------ 협동 세션 병합
#
# 1인 게임이면 이 섹션을 쓰지 않는다.
#
# 여러 명이 한 세션에 들어가고 참가자마다 로그 파일이 따로 생기는 게임이면,
# 같은 사건이 파일마다 한 번씩 기록되는 이벤트를 여기에 적는다. 적지 않으면
# 합계가 참가자 수만큼 부풀려진다(오류는 나지 않는다).
#
# 무엇을 적어야 할지 모르겠으면 2인 세션 로그를 적재한 뒤
#     python merge_check.py --db playtest.sqlite
# 를 돌린다. 두 파일에 같은 내용으로 들어 있는 이벤트를 후보로 짚어준다.
#
# merge:
#   shared_state:                      # 파티가 공유하는 상태
#     coins_changed:
#       key: [currency, delta, balance]   # 모든 클라이언트에서 같은 값만
#       only: { currency: [party_gold] }  # 선택 — 이 값일 때만 공유로 본다
#   broadcast:                         # 호스트/서버가 전원에게 알리는 사건
#     boss_defeated: [boss_id, spawn_id]
#   reason_correction:                 # 선택 — 사유를 뒤늦게 알려주는 이벤트
#     event: coins_reason_corrected
#     target: coins_changed
#     match: [currency, delta]
#   clock_pairs:                       # 선택 — merge_check.py 의 시계 오차 측정용
#     - observed: player_downed        #   상대가 관측한 이벤트
#       who: user_id                   #   거기서 당사자를 가리키는 파라미터
#       who_format: "p{}"              #   그 값을 player_id 로 바꾸는 틀 (기본 "{}")
#       cause: level_failed            #   당사자 쪽에 남는 원인 이벤트
