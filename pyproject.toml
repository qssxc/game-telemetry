[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "playtest-telemetry"
dynamic = ["version"]
description = "플레이테스트 로그(NDJSON)를 SQLite 에 적재하고 지표를 계산하는 분석 도구"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=5.1"]

[project.scripts]
ptel = "playtest_telemetry.cli:main"

[project.urls]
Repository = "https://github.com/qssxc/game-telemetry"
Changelog = "https://github.com/qssxc/game-telemetry/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["playtest_telemetry"]

[tool.setuptools.dynamic]
version = { attr = "playtest_telemetry.__version__" }

[tool.setuptools.package-data]
playtest_telemetry = ["views.sql", "templates/*"]
